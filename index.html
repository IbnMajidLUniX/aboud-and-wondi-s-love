<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09070d" />
  <meta name="description" content="عبودي ونودي — حكاية بدأت في عدن بالصدفة، وكبرت بالمواقف والضحك والذكريات." />

  <title>🐒 عبودي ونودي | حكاية بدأت بالصدفة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#08070c;
      --bg2:#100b16;
      --card:rgba(255,255,255,.055);
      --card-strong:rgba(255,255,255,.085);
      --text:#fffaf4;
      --muted:#c9c0c8;
      --gold:#e9c879;
      --gold2:#fff0b4;
      --pink:#e7a4bc;
      --purple:#9a7ad7;
      --line:rgba(255,255,255,.11);
      --shadow:0 25px 90px rgba(0,0,0,.5);
      --radius:28px;
    }

    [data-theme="light"]{
      --bg:#f5f0ea;
      --bg2:#ebe1e8;
      --card:rgba(255,255,255,.62);
      --card-strong:rgba(255,255,255,.82);
      --text:#211b20;
      --muted:#675e65;
      --line:rgba(40,25,35,.12);
      --shadow:0 25px 70px rgba(67,44,58,.16);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(154,122,215,.12), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(231,164,188,.10), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(233,200,121,.08), transparent 35%),
        linear-gradient(145deg,var(--bg),var(--bg2));
      font-family:"Cairo","Tajawal",sans-serif;
      transition:background .7s ease,color .5s ease;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-4;
      pointer-events:none;
      background:
        linear-gradient(115deg,transparent 0%,rgba(255,255,255,.018) 45%,transparent 70%);
      animation:ambient 12s ease-in-out infinite alternate;
    }

    @keyframes ambient{
      from{transform:translateX(-5%) scale(1)}
      to{transform:translateX(5%) scale(1.08)}
    }

    #particles{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:-3;
      pointer-events:none;
      opacity:.72;
    }

    .stars{
      position:fixed;
      inset:0;
      z-index:-2;
      pointer-events:none;
      overflow:hidden;
    }

    .star{
      position:absolute;
      width:2px;
      height:2px;
      border-radius:50%;
      background:rgba(255,240,180,.8);
      box-shadow:0 0 8px rgba(255,220,150,.8);
      animation:twinkle var(--duration) ease-in-out infinite alternate;
      animation-delay:var(--delay);
    }

    @keyframes twinkle{
      from{opacity:.15;transform:scale(.7)}
      to{opacity:.95;transform:scale(1.6)}
    }

    .cursor-glow{
      position:fixed;
      width:260px;
      height:260px;
      border-radius:50%;
      pointer-events:none;
      z-index:0;
      transform:translate(-50%,-50%);
      background:radial-gradient(circle,rgba(233,200,121,.075),transparent 68%);
      mix-blend-mode:screen;
      opacity:0;
      transition:opacity .3s;
    }

    @media(hover:hover){
      .cursor-glow{opacity:1}
    }

    .preloader{
      position:fixed;
      inset:0;
      z-index:9999;
      display:grid;
      place-items:center;
      background:#08070c;
      transition:opacity .9s ease,visibility .9s ease;
    }

    .preloader.hide{
      opacity:0;
      visibility:hidden;
    }

    .loader-content{
      text-align:center;
    }

    .loader-monkey{
      font-size:4rem;
      display:block;
      animation:loaderFloat 1.5s ease-in-out infinite;
      filter:drop-shadow(0 0 22px rgba(233,200,121,.35));
    }

    .loader-line{
      width:150px;
      height:2px;
      margin:22px auto 0;
      overflow:hidden;
      background:rgba(255,255,255,.1);
    }

    .loader-line::after{
      content:"";
      display:block;
      width:55%;
      height:100%;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
      animation:loaderLine 1.2s ease-in-out infinite;
    }

    @keyframes loaderFloat{
      50%{transform:translateY(-9px) rotate(3deg)}
    }

    @keyframes loaderLine{
      from{transform:translateX(-180%)}
      to{transform:translateX(280%)}
    }

    .app{
      width:min(1180px,94%);
      margin:auto;
      padding:20px 0 70px;
      position:relative;
      z-index:1;
    }

    header.topbar{
      position:sticky;
      top:12px;
      z-index:50;
      margin-bottom:20px;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:22px;
      background:rgba(10,8,14,.58);
      backdrop-filter:blur(20px) saturate(140%);
      -webkit-backdrop-filter:blur(20px) saturate(140%);
      box-shadow:0 15px 45px rgba(0,0,0,.16);
      display:flex;
      align-items:center;
      gap:12px;
    }

    [data-theme="light"] header.topbar{
      background:rgba(255,255,255,.66);
    }

    .brand{
      font-family:"Amiri",serif;
      font-size:1.25rem;
      color:var(--gold2);
      white-space:nowrap;
    }

    .progress-area{
      flex:1;
      min-width:0;
    }

    .progress-info{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:7px;
      color:var(--muted);
      font-size:.72rem;
    }

    .progress-info strong{
      color:var(--gold);
      font-weight:700;
    }

    .progress-track{
      height:4px;
      border-radius:20px;
      background:rgba(255,255,255,.09);
      overflow:hidden;
    }

    .progress-bar{
      height:100%;
      width:3.33%;
      border-radius:inherit;
      background:linear-gradient(90deg,var(--gold),var(--gold2),var(--pink));
      box-shadow:0 0 15px rgba(233,200,121,.4);
      transition:width .8s cubic-bezier(.22,1,.36,1);
    }

    .top-actions{
      display:flex;
      gap:7px;
    }

    button{
      border:0;
      font-family:inherit;
      cursor:pointer;
      color:inherit;
    }

    .icon-btn{
      width:40px;
      height:40px;
      border-radius:13px;
      border:1px solid var(--line);
      background:var(--card);
      display:grid;
      place-items:center;
      font-size:1rem;
      transition:.3s ease;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible{
      transform:translateY(-2px);
      border-color:rgba(233,200,121,.45);
      background:var(--card-strong);
      box-shadow:0 8px 25px rgba(0,0,0,.18);
      outline:none;
    }

    .cover{
      min-height:calc(100vh - 110px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:50px 0 80px;
    }

    .cover-card{
      width:min(920px,100%);
      min-height:650px;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(233,200,121,.18);
      border-radius:40px;
      background:
        linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.018)),
        radial-gradient(circle at 50% 30%,rgba(233,200,121,.12),transparent 35%);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      box-shadow:var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      isolation:isolate;
    }

    .cover-card::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:42px;
      padding:1px;
      background:linear-gradient(120deg,transparent 20%,rgba(233,200,121,.55),transparent 50%,rgba(231,164,188,.35),transparent 80%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      animation:borderFlow 8s linear infinite;
      pointer-events:none;
    }

    @keyframes borderFlow{
      to{transform:rotate(360deg)}
    }

    .cover-orb{
      position:absolute;
      width:300px;
      height:300px;
      border-radius:50%;
      filter:blur(50px);
      opacity:.15;
      pointer-events:none;
    }

    .orb-one{
      background:var(--gold);
      top:-110px;
      right:-80px;
      animation:orbMove 9s ease-in-out infinite alternate;
    }

    .orb-two{
      background:var(--pink);
      bottom:-120px;
      left:-80px;
      animation:orbMove 11s ease-in-out infinite alternate-reverse;
    }

    @keyframes orbMove{
      to{transform:translate(45px,35px) scale(1.2)}
    }

    .cover-content{
      position:relative;
      z-index:2;
      padding:55px 30px;
    }

    .monkey{
      font-size:clamp(4rem,11vw,7rem);
      display:inline-block;
      filter:drop-shadow(0 0 30px rgba(233,200,121,.3));
      animation:heroMonkey 4s ease-in-out infinite;
    }

    @keyframes heroMonkey{
      0%,100%{transform:translateY(0) rotate(-2deg)}
      50%{transform:translateY(-13px) rotate(2deg)}
    }

    .eyebrow{
      margin:18px 0 8px;
      color:var(--gold);
      font-size:.75rem;
      letter-spacing:4px;
      text-transform:uppercase;
    }

    .cover-title{
      font-family:"Amiri",serif;
      font-size:clamp(4rem,10vw,8.5rem);
      line-height:.95;
      margin:0;
      background:linear-gradient(135deg,#fff,var(--gold2),var(--pink),#fff);
      background-size:300% 300%;
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      animation:titleShimmer 7s ease-in-out infinite;
      text-shadow:0 0 50px rgba(233,200,121,.08);
    }

    @keyframes titleShimmer{
      0%,100%{background-position:0 50%}
      50%{background-position:100% 50%}
    }

    .cover-subtitle{
      font-family:"Amiri",serif;
      font-size:clamp(1.25rem,3vw,2rem);
      color:var(--muted);
      margin:24px auto 35px;
      max-width:680px;
      line-height:2;
    }

    .start-btn{
      position:relative;
      padding:15px 35px;
      border-radius:100px;
      background:linear-gradient(135deg,var(--gold),#c99f45);
      color:#21170a;
      font-weight:800;
      font-size:1rem;
      overflow:hidden;
      box-shadow:0 12px 40px rgba(233,200,121,.2);
      transition:.35s ease;
    }

    .start-btn::before{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      width:40%;
      right:-60%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
      transform:skewX(-20deg);
      animation:shine 3.8s ease-in-out infinite;
    }

    @keyframes shine{
      0%,50%{right:-70%}
      75%,100%{right:120%}
    }

    .start-btn:hover,
    .start-btn:focus-visible{
      transform:translateY(-4px) scale(1.02);
      box-shadow:0 18px 50px rgba(233,200,121,.32);
      outline:none;
    }

    .story{
      display:none;
    }

    .story.active{
      display:block;
    }

    .chapter-shell{
      min-height:650px;
      padding:25px 0 30px;
    }

    .chapter-card{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:
        linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      box-shadow:var(--shadow);
      padding:clamp(25px,5vw,62px);
    }

    .chapter-card::after{
      content:"";
      position:absolute;
      width:360px;
      height:360px;
      border-radius:50%;
      left:-180px;
      bottom:-220px;
      background:radial-gradient(circle,rgba(231,164,188,.12),transparent 68%);
      pointer-events:none;
    }

    .chapter-header{
      position:relative;
      z-index:1;
      margin-bottom:38px;
      padding-bottom:28px;
      border-bottom:1px solid var(--line);
    }

    .chapter-number{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--gold);
      font-size:.78rem;
      font-weight:800;
      letter-spacing:1px;
      margin-bottom:12px;
    }

    .chapter-number::before{
      content:"";
      width:28px;
      height:1px;
      background:var(--gold);
      box-shadow:0 0 10px var(--gold);
    }

    .chapter-title{
      font-family:"Amiri",serif;
      font-size:clamp(2.3rem,6vw,4.7rem);
      line-height:1.1;
      margin-bottom:14px;
      color:var(--text);
    }

    .chapter-hook{
      color:var(--muted);
      font-family:"Amiri",serif;
      font-size:1.15rem;
      line-height:1.9;
    }

    .story-content{
      position:relative;
      z-index:1;
      max-width:900px;
      margin:auto;
    }

    .story-content p{
      color:var(--text);
      opacity:.93;
      font-size:clamp(1rem,1.5vw,1.16rem);
      line-height:2.35;
      margin:0 0 22px;
    }

    .story-content p.dialogue{
      border-right:2px solid rgba(233,200,121,.6);
      padding:9px 20px;
      margin:26px 0;
      color:var(--gold2);
      background:linear-gradient(90deg,transparent,rgba(233,200,121,.035));
      border-radius:0 14px 14px 0;
    }

    .story-content .scene{
      margin:30px 0;
      padding:22px 24px;
      border:1px solid rgba(255,255,255,.07);
      border-radius:20px;
      background:rgba(0,0,0,.10);
      color:var(--muted);
      line-height:2.1;
    }

    .chapter-end{
      margin-top:45px;
      padding:25px;
      border-radius:22px;
      border:1px solid rgba(233,200,121,.16);
      background:linear-gradient(135deg,rgba(233,200,121,.07),rgba(231,164,188,.035));
      text-align:center;
      font-family:"Amiri",serif;
      font-size:1.25rem;
      color:var(--gold2);
    }

    .chapter-controls{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin:24px 0 0;
    }

    .nav-btn{
      min-width:145px;
      padding:14px 22px;
      border-radius:16px;
      border:1px solid var(--line);
      background:var(--card);
      color:var(--text);
      font-weight:700;
      transition:.3s ease;
    }

    .nav-btn:hover:not(:disabled),
    .nav-btn:focus-visible:not(:disabled){
      transform:translateY(-3px);
      border-color:rgba(233,200,121,.42);
      box-shadow:0 12px 30px rgba(0,0,0,.18);
      outline:none;
    }

    .nav-btn.next{
      background:linear-gradient(135deg,rgba(233,200,121,.17),rgba(233,200,121,.06));
      border-color:rgba(233,200,121,.25);
      color:var(--gold2);
    }

    .nav-btn:disabled{
      opacity:.25;
      cursor:not-allowed;
    }

    .chapter-count{
      color:var(--muted);
      font-size:.75rem;
      text-align:center;
    }

    .finish-screen{
      display:none;
      min-height:600px;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:60px 20px;
    }

    .finish-screen.show{
      display:flex;
    }

    .finish-card{
      width:min(820px,100%);
      padding:65px 35px;
      border-radius:35px;
      border:1px solid rgba(233,200,121,.2);
      background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.015));
      backdrop-filter:blur(20px);
      box-shadow:var(--shadow);
    }

    .finish-card .emoji{
      font-size:4.5rem;
      display:block;
      margin-bottom:20px;
    }

    .finish-card h2{
      font-family:"Amiri",serif;
      font-size:clamp(2rem,5vw,4rem);
      line-height:1.5;
      color:var(--gold2);
      margin-bottom:20px;
    }

    .finish-card p{
      color:var(--muted);
      font-family:"Amiri",serif;
      font-size:1.35rem;
      line-height:2;
    }

    .finish-card .restart{
      margin-top:30px;
    }

    .modal{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(3,2,5,.72);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .modal.open{
      display:flex;
      animation:modalIn .35s ease both;
    }

    @keyframes modalIn{
      from{opacity:0}
      to{opacity:1}
    }

    .modal-card{
      width:min(650px,100%);
      max-height:85vh;
      overflow:auto;
      border:1px solid var(--line);
      border-radius:28px;
      background:var(--bg2);
      box-shadow:var(--shadow);
      padding:25px;
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      padding-bottom:18px;
      border-bottom:1px solid var(--line);
      margin-bottom:15px;
    }

    .modal-head h2{
      font-family:"Amiri",serif;
      color:var(--gold2);
      font-size:1.7rem;
    }

    .chapter-list{
      display:grid;
      gap:7px;
    }

    .chapter-list button{
      width:100%;
      text-align:right;
      padding:13px 15px;
      border-radius:14px;
      background:transparent;
      color:var(--muted);
      border:1px solid transparent;
      transition:.25s ease;
    }

    .chapter-list button:hover{
      background:var(--card);
      color:var(--text);
      border-color:var(--line);
    }

    .chapter-list button.current{
      color:#22180c;
      background:linear-gradient(135deg,var(--gold),#c99f45);
      font-weight:800;
    }

    .toast{
      position:fixed;
      bottom:25px;
      left:50%;
      transform:translate(-50%,20px);
      z-index:150;
      padding:11px 20px;
      border-radius:100px;
      background:rgba(15,11,20,.9);
      border:1px solid rgba(233,200,121,.2);
      color:var(--gold2);
      backdrop-filter:blur(14px);
      opacity:0;
      pointer-events:none;
      transition:.35s ease;
      font-size:.8rem;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    .back-top{
      position:fixed;
      left:18px;
      bottom:18px;
      z-index:60;
      width:44px;
      height:44px;
      border-radius:15px;
      background:var(--card-strong);
      border:1px solid var(--line);
      opacity:0;
      transform:translateY(15px);
      pointer-events:none;
      transition:.3s ease;
    }

    .back-top.show{
      opacity:1;
      transform:none;
      pointer-events:auto;
    }

    .transition-curtain{
      position:fixed;
      inset:0;
      z-index:90;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 50%,rgba(233,200,121,.12),transparent 22%),
        rgba(7,5,10,.96);
      transform:scaleY(0);
      transform-origin:bottom;
    }

    .transition-curtain.run{
      animation:curtain .9s cubic-bezier(.77,0,.18,1);
    }

    @keyframes curtain{
      0%{transform:scaleY(0)}
      45%{transform:scaleY(1)}
      55%{transform:scaleY(1)}
      100%{transform:scaleY(0);transform-origin:top}
    }

    .chapter-card.animate-in .chapter-header{
      animation:chapterHead .75s cubic-bezier(.22,1,.36,1) both;
    }

    .chapter-card.animate-in .story-content{
      animation:contentIn .9s .12s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes chapterHead{
      from{opacity:0;transform:translateY(22px);filter:blur(8px)}
      to{opacity:1;transform:none;filter:none}
    }

    @keyframes contentIn{
      from{opacity:0;transform:translateY(25px);filter:blur(5px)}
      to{opacity:1;transform:none;filter:none}
    }

    .cover.hidden{
      display:none;
    }

    @media(max-width:700px){
      .app{
        width:min(94%,650px);
        padding-top:8px;
      }

      header.topbar{
        top:7px;
        border-radius:17px;
      }

      .brand{
        display:none;
      }

      .topbar{
        padding:9px;
      }

      .cover{
        min-height:calc(100vh - 80px);
        padding:20px 0 45px;
      }

      .cover-card{
        min-height:600px;
        border-radius:30px;
      }

      .cover-content{
        padding:45px 20px;
      }

      .chapter-card{
        border-radius:23px;
        padding:25px 19px;
      }

      .chapter-shell{
        min-height:0;
      }

      .chapter-controls{
        position:sticky;
        bottom:10px;
        z-index:20;
        padding:8px;
        border:1px solid var(--line);
        border-radius:18px;
        background:rgba(10,8,14,.76);
        backdrop-filter:blur(15px);
      }

      [data-theme="light"] .chapter-controls{
        background:rgba(255,255,255,.76);
      }

      .nav-btn{
        min-width:0;
        flex:1;
        padding:13px 10px;
        font-size:.78rem;
      }

      .chapter-count{
        display:none;
      }

      .story-content p{
        font-size:.98rem;
        line-height:2.25;
      }

      .story-content .scene{
        padding:17px;
      }

          <p class="dialogue">«أنا ما أقول إن الحياة مضمونة، لكن أعرف أني أحترمها وأحترم أهلها، وإذا فيه نصيب أبغى أمشي بالطريق الصحيح.»</p>

          <p>كان كلامه هادئًا، ولذلك أخذته أسرته بجدية.</p>

          <p>في النهاية قال أحدهم:</p>

          <p class="dialogue">«إذا جاء الوقت المناسب، نشوف الموضوع رسميًا.»</p>

          <p>شعر عبودي براحة كبيرة.</p>

          <div class="chapter-end">«الآن لم تعد الحكاية بين ثلاثة أصدقاء فقط... بدأت تقترب من العائلة.»</div>
        `
      },
      {
        title:"الاستعداد الرسمي",
        hook:"قبل الخطوة الرسمية، هناك تفاصيل صغيرة أكثر توترًا من الخطوة نفسها.",
        text:`
          <p>بدأت العائلة تتعرف على الصورة بشكل أكبر. أحمد كان يعرف أن الأمر أصبح جديًا، ولذلك كان متوترًا أكثر من عبودي نفسه.</p>

          <p class="dialogue">أحمد: «أنت متأكد؟»<br>عبودي: «إيه.»<br>أحمد: «لأن بعدين ما فيه تقول كنت أمزح.»<br>عبودي: «أنا من البداية ما كنت أمزح.»<br>أحمد: «طيب ليه كنت تسأل عن الجينات؟»<br>عبودي: «يا أخي انسَ الموضوع.»</p>

          <p>ضحك الاثنان.</p>

          <p>في الجانب الآخر، كانت نودي تعرف أن هناك حديثًا رسميًا سيحدث، لكنها لم تكن تعرف كل التفاصيل. وكانت العائلة هي صاحبة القرار في كل خطوة.</p>

          <p>لم يعد الموضوع رسائل أو مشاوير، بل أصبح حديثًا عن المستقبل، مع احترام العمر والظروف والدراسة وموافقة الأهل.</p>

          <p>كان عبودي متوترًا. حتى إنه في يوم الاستعداد قال لأحمد:</p>

          <p class="dialogue">«أحس إني رايح اختبار.»</p>

          <p>أحمد رد:</p>

          <p class="dialogue">«هذا اختبار، بس ما فيه ورقة أسئلة.»</p>

          <p>عبودي: «أنت تزيد توتري.»</p>

          <div class="chapter-end">«اقترب اليوم الذي ستنتقل فيه الحكاية من الذكريات إلى الكلام الرسمي.»</div>
        `
      },
      {
        title:"زيارة العائلة",
        hook:"عندما تدخل العائلتان في المشهد، تصبح كل كلمة محسوبة... حتى الضحكة.",
        text:`
          <p>جاء اليوم الذي اجتمعت فيه العائلتان في لقاء رسمي محترم. كان عبودي متوترًا أكثر مما توقع.</p>

          <p>كان أحمد حاضرًا أيضًا، يحاول أن يبدو طبيعيًا، لكنه كان في الحقيقة يراقب كل شيء.</p>

          <p>عبودي جلس بهدوء، وتحدث عن نفسه ودراسته وخططه للمستقبل. لم يحاول أن يقدم نفسه بصورة مثالية، بل تحدث كما هو.</p>

          <p>عندما جاء الحديث عن كيف تعرف على نودي، قال ببساطة:</p>

          <p class="dialogue">«عن طريق أحمد... كنا أصدقاء في المدرسة، وبعدها صارت بيننا معرفة عائلية محترمة.»</p>

          <p>ابتسم أحمد.</p>

          <p>ثم قال أحد أفراد العائلة مازحًا:</p>

          <p class="dialogue">«يعني أحمد هو السبب؟»</p>

          <p>رد عبودي:</p>

          <p class="dialogue">«هو السبب في البداية... وهو السبب في كل التحقيقات بعدين.»</p>

          <p>ضحك الجميع، حتى أحمد قال: «أنا بريء.»</p>

          <p>خف التوتر قليلًا.</p>

          <p>في النهاية، لم يكن هناك استعجال. اتفق الجميع أن الأمور الكبيرة تحتاج وقتها المناسب، وأن الدراسة والمستقبل أولًا، وأن أي خطوة رسمية لاحقة تكون عندما تكون الظروف والعمر والاستعداد مناسبين.</p>

          <div class="chapter-end">«انتهت الزيارة بهدوء... لكن الجميع عرف أن هذه لم تعد مجرد قصة يتحدث عنها الأصدقاء.»</div>
        `
      },
      {
        title:"الخطوة التي انتظرها",
        hook:"بعض النهايات لا تكون زواجًا ولا بداية حياة جديدة فورًا... أحيانًا تكون وعدًا بأن الطريق سيستمر عندما يحين وقته.",
        text:`
          <p>مرت فترة أخرى، وكبرت الحكاية مع أصحابها. لم يعد عبودي ذلك الطالب الجديد الذي لا يعرف طرق المدرسة، ولم تعد نودي مجرد اسم سمعه لأول مرة من أحمد.</p>

          <p>كانت هناك سنوات من الذكريات: مشاوير، اختبارات، ضحكات، مواقف محرجة، سوء فهم، اعتذارات، وأيام عادية أصبحت مع الوقت أجمل الذكريات.</p>

          <p>وفي جلسة عائلية هادئة، تم الحديث عن المستقبل بشكل أوضح. لم يكن هناك استعجال، ولم يكن هناك قرار يُفرض على أحد. كان الجميع يعرف أن الخطوة الصحيحة تأتي عندما يكون الطرفان راشدين ومستعدين، وبعد موافقة العائلتين.</p>

          <p>نظر أحمد إلى عبودي وقال:</p>

          <p class="dialogue">«تذكر أول يوم قلت لك عندي أخت اسمها نودي؟»</p>

          <p>ضحك عبودي.</p>

          <p class="dialogue">«كنت أتمنى وقتها أنك ما تقول.»</p>

          <p>أحمد: «ليش؟»</p>

          <p>عبودي: «لأنك بعدها ما خليتني أعيش.»</p>

          <p>دخلت نودي في الحديث وقالت:</p>

          <p class="dialogue">«وش سويتوا؟»</p>

          <p>أحمد: «نحكي التاريخ.»</p>

          <p>نودي: «التاريخ هذا أنا أعرفه.»</p>

          <p>عبودي: «للأسف، كلنا نعرفه.»</p>

          <p>ضحكوا.</p>

          <div class="chapter-end">«الآن أصبحت الحكاية وعدًا للمستقبل... لا استعجال فيه، ولا ضغط، فقط نية واضحة واحترام للطريق.»</div>
        `
      },
      {
        title:"بداية جديدة",
        hook:"وهنا لا تنتهي الحكاية... لأنها أصلًا لم تكن عن نهاية سريعة.",
        text:`
          <p>إذا رجع عبودي بذاكرته إلى البداية، سيجد أن كل شيء بدأ بطريقة عادية جدًا.</p>

          <p>شاب من مواليد ذمار عام 2006، انتقل إلى عدن للدراسة في الصف الأول الثانوي. دخل مدرسة جديدة، تعرف على شخص اسمه أحمد، وصارت بينهما صداقة.</p>

          <p>ثم جاء اسم نودي.</p>

          <p>نودي، من مواليد أبين عام 2011، كانت في البداية مجرد أخت لصديق. ثم أصبحت وجهًا يعرفه، وشخصية يفهمها، وذكريات مشتركة، ومشاعر تعلم عبودي كيف يتعامل معها باحترام.</p>

          <p>لم تكن القصة مثالية. عبودي أخطأ، توتر، غار قليلًا، فهم أشياء بشكل خاطئ، وأرسل رسالة للشخص الخطأ. أحمد بالغ في المزاح، وحقق أكثر مما ينبغي، ونودي كانت تضحك أحيانًا وتستغرب أحيانًا أخرى.</p>

          <p>وهذا تحديدًا ما جعل الحكاية تبدو حقيقية.</p>

          <div class="scene">لأن الحياة لا تمشي دائمًا كما في القصص. أحيانًا تضيع موقف السيارة. أحيانًا تتأخر عن الموعد. أحيانًا تقول كلمة وتندم عليها. وأحيانًا تكون أجمل لحظة في يومك مجرد ضحكة داخل سيارة في طريق عادي.</div>

          <p>وعندما سأل أحدهم عبودي يومًا: «متى بدأت الحكاية؟» لم يعرف ماذا يقول.</p>

          <p>هل بدأت عندما تعرف على أحمد؟ أم عندما سمع اسم نودي؟ أم في أول مشوار؟ أم في أول ضحكة؟</p>

          <p>ربما بدأت قبل كل ذلك بقليل.</p>

          <p>وربما لم تبدأ في يوم محدد أصلًا.</p>

          <div class="chapter-end">«بعض القصص تبدأ بنظرة... وقصة عبودي ونودي بدأت بصديق اسمه أحمد.»</div>
        `
      }
    ];

    const el = {
      preloader:document.getElementById("preloader"),
      cover:document.getElementById("cover"),
      story:document.getElementById("story"),
      finish:document.getElementById("finishScreen"),
      start:document.getElementById("startBtn"),
      restart:document.getElementById("restartBtn"),
      card:document.getElementById("chapterCard"),
      number:document.getElementById("chapterNumber"),
      title:document.getElementById("chapterTitle"),
      hook:document.getElementById("chapterHook"),
      content:document.getElementById("storyContent"),
      prev:document.getElementById("prevBtn"),
      next:document.getElementById("nextBtn"),
      count:document.getElementById("chapterCount"),
      label:document.getElementById("chapterLabel"),
      percent:document.getElementById("progressPercent"),
      bar:document.getElementById("progressBar"),
      modal:document.getElementById("chaptersModal"),
      modalBtn:document.getElementById("chaptersBtn"),
      closeModal:document.getElementById("closeModal"),
      list:document.getElementById("chapterList"),
      theme:document.getElementById("themeBtn"),
      toast:document.getElementById("toast"),
      backTop:document.getElementById("backTop"),
      curtain:document.getElementById("curtain"),
      cursor:document.getElementById("cursorGlow")
    };

    let current = Number(localStorage.getItem("aboudiNodiChapter") || 0);
    current = Math.max(0,Math.min(current,chapters.length - 1));

    const arabicNumbers = [
      "الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر",
      "الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر",
      "الثامن عشر","التاسع عشر","العشرون","الحادي والعشرون","الثاني والعشرون","الثالث والعشرون",
      "الرابع والعشرون","الخامس والعشرون","السادس والعشرون","السابع والعشرون","الثامن والعشرون",
      "التاسع والعشرون","الثلاثون"
    ];

    function showToast(message){
      el.toast.textContent = message;
      el.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(()=>el.toast.classList.remove("show"),2200);
    }

    function updateProgress(){
      const percent = Math.round(((current + 1) / chapters.length) * 100);
      el.label.textContent = `الفصل ${current + 1} من ${chapters.length}`;
      el.percent.textContent = `${percent}%`;
      el.bar.style.width = `${percent}%`;
      el.count.textContent = `${current + 1} / ${chapters.length}`;
    }

    function renderChapter(animate=true){
      const c = chapters[current];

      el.number.textContent = `الفصل ${arabicNumbers[current]}`;
      el.title.textContent = c.title;
      el.hook.textContent = c.hook;
      el.content.innerHTML = c.text;

      el.prev.disabled = current === 0;
      el.next.disabled = current === chapters.length - 1;

      updateProgress();

      localStorage.setItem("aboudiNodiChapter",current);

      if(animate){
        el.card.classList.remove("animate-in");
        void el.card.offsetWidth;
        el.card.classList.add("animate-in");
      }

      requestAnimationFrame(()=>{
        window.scrollTo({top:0,behavior:"smooth"});
      });
    }

    function enterStory(){
      el.cover.classList.add("hidden");
      el.story.classList.add("active");
      el.finish.classList.remove("show");
      renderChapter(false);
      window.scrollTo({top:0,behavior:"smooth"});
      showToast(`تم حفظ الفصل ${current + 1}`);
    }

    function transitionTo(index){
      if(index < 0 || index >= chapters.length || index === current) return;

      el.curtain.classList.remove("run");
      void el.curtain.offsetWidth;
      el.curtain.classList.add("run");

      setTimeout(()=>{
        current = index;
        renderChapter(true);
      },380);
    }

    function nextChapter(){
      if(current < chapters.length - 1){
        transitionTo(current + 1);
      }else{
        showFinish();
      }
    }

    function previousChapter(){
      if(current > 0){
        transitionTo(current - 1);
      }
    }

    function showFinish(){
      el.story.classList.remove("active");
      el.finish.classList.add("show");
      localStorage.setItem("aboudiNodiFinished","true");
      window.scrollTo({top:0,behavior:"smooth"});
      updateProgress();
    }

    function buildChapterList(){
      el.list.innerHTML = chapters.map((chapter,index)=>`
        <button data-index="${index}" class="${index === current ? "current" : ""}">
          <span>${String(index + 1).padStart(2,"0")}</span>
          — ${chapter.title}
        </button>
      `).join("");

      el.list.querySelectorAll("button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const index = Number(btn.dataset.index);
          current = index;
          el.modal.classList.remove("open");
          el.cover.classList.add("hidden");
          el.finish.classList.remove("show");
          el.story.classList.add("active");
          renderChapter(true);
        });
      });
    }

    el.start.addEventListener("click",enterStory);
    el.restart.addEventListener("click",()=>{
      current = 0;
      localStorage.setItem("aboudiNodiChapter","0");
      el.finish.classList.remove("show");
      el.cover.classList.remove("hidden");
      el.story.classList.remove("active");
      window.scrollTo({top:0,behavior:"smooth"});
      showToast("بدأت الحكاية من جديد");
    });

    el.next.addEventListener("click",nextChapter);
    el.prev.addEventListener("click",previousChapter);

    el.modalBtn.addEventListener("click",()=>{
      buildChapterList();
      el.modal.classList.add("open");
    });

    el.closeModal.addEventListener("click",()=>{
      el.modal.classList.remove("open");
    });

    el.modal.addEventListener("click",(e)=>{
      if(e.target === el.modal) el.modal.classList.remove("open");
    });

    el.theme.addEventListener("click",()=>{
      const light = document.body.getAttribute("data-theme") === "light";
      document.body.setAttribute("data-theme",light ? "dark" : "light");
      localStorage.setItem("aboudiNodiTheme",light ? "dark" : "light");
      el.theme.textContent = light ? "☾" : "☀";
      showToast(light ? "الوضع الليلي" : "الوضع المضيء");
    });

    const savedTheme = localStorage.getItem("aboudiNodiTheme");
    if(savedTheme === "light"){
      document.body.setAttribute("data-theme","light");
      el.theme.textContent = "☀";
    }

    document.addEventListener("keydown",(e)=>{
      if(e.key === "Escape"){
        el.modal.classList.remove("open");
        return;
      }

      if(!el.story.classList.contains("active")) return;

      /*
        حسب المطلوب:
        ← الفصل التالي
        → الفصل السابق
      */
      if(e.key === "ArrowLeft"){
        e.preventDefault();
        nextChapter();
      }

      if(e.key === "ArrowRight"){
        e.preventDefault();
        previousChapter();
      }

      if(e.key === "Home"){
        e.preventDefault();
        transitionTo(0);
      }

      if(e.key === "End"){
        e.preventDefault();
        transitionTo(chapters.length - 1);
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener("touchstart",(e)=>{
      if(!el.story.classList.contains("active")) return;
      const t = e.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    },{passive:true});

    document.addEventListener("touchend",(e)=>{
      if(!el.story.classList.contains("active")) return;

      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;

      if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)) return;

      if(dx < 0){
        nextChapter();
      }else{
        previousChapter();
      }
    },{passive:true});

    window.addEventListener("scroll",()=>{
      el.backTop.classList.toggle("show",window.scrollY > 450);
    });

    el.backTop.addEventListener("click",()=>{
      window.scrollTo({top:0,behavior:"smooth"});
    });

    document.addEventListener("mousemove",(e)=>{
      el.cursor.style.left = `${e.clientX}px`;
      el.cursor.style.top = `${e.clientY}px`;
    });

    /*
      نجوم الخلفية
    */
    const stars = document.getElementById("stars");

    for(let i=0;i<90;i++){
      const star = document.createElement("span");
      star.className = "star";
      star.style.left = `${Math.random()*100}%`;
      star.style.top = `${Math.random()*100}%`;
      star.style.setProperty("--duration",`${2 + Math.random()*5}s`);
      star.style.setProperty("--delay",`${Math.random()*-5}s`);
      star.style.opacity = `${.2 + Math.random()*.7}`;
      stars.appendChild(star);
    }

    /*
      جسيمات Canvas
    */
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    let particles = [];
    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1,2);

    function resizeCanvas(){
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1,2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

      ctx.setTransform(dpr,0,0,dpr,0,0);

      const count = width < 700 ? 45 : 80;

      particles = Array.from({length:count},()=>({
        x:Math.random()*width,
        y:Math.random()*height,
        r:.4 + Math.random()*1.4,
        vx:(Math.random()-.5)*.12,
        vy:-.08 - Math.random()*.22,
        alpha:.15 + Math.random()*.5,
        gold:Math.random() > .72
      }));
    }

    function animateParticles(){
      ctx.clearRect(0,0,width,height);

      for(const p of particles){
        p.x += p.vx;
        p.y += p.vy;

        if(p.y < -10){
          p.y = height + 10;
          p.x = Math.random()*width;
        }

        if(p.x < -10) p.x = width + 10;
        if(p.x > width + 10) p.x = -10;

        const light = p.gold ? "233,200,121" : "231,164,188";

        ctx.beginPath();
        ctx.fillStyle = `rgba(${light},${p.alpha})`;
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
      }

      requestAnimationFrame(animateParticles);
    }

    resizeCanvas();
    animateParticles();

    window.addEventListener("resize",resizeCanvas);

    /*
      بدء التحميل
    */
    window.addEventListener("load",()=>{
      setTimeout(()=>{
        el.preloader.classList.add("hide");
      },900);

      renderChapter(false);
    });

    /*
      إذا أعاد المستخدم فتح الصفحة:
      نعيد آخر فصل محفوظ، لكن نترك شاشة الغلاف حتى يبدأ بنفسه.
    */
    if(localStorage.getItem("aboudiNodiChapter")){
      current = Number(localStorage.getItem("aboudiNodiChapter"));
      current = Math.max(0,Math.min(current,chapters.length - 1));
    }

    /*
      منع فتح قائمة الفصول أثناء الضغط على Escape
    */
    document.addEventListener("click",(e)=>{
      const chapterButton = e.target.closest(".chapter-list button");
      if(chapterButton){
        buildChapterList();
      }
    });
  </script>
</body>
</html>
